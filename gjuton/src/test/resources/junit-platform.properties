# Parallelism is opt-in per class, via @Execution(CONCURRENT). Enabling it here only
# makes that annotation take effect; everything unannotated keeps running one at a time.
#
# @Execution(CONCURRENT) also makes the annotated class itself eligible to run alongside
# other classes, which surefire does not account for: with more than one such class it
# attributes cases to the wrong per-class report. The run total stays correct, so trust
# the aggregate rather than the per-class counts.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
